name: CI

# Validation pipeline. Runs on every push to main and on every PR targeting main.
# No deployment happens here — publishing to GitHub Pages is handled solely by
# deploy-pages.yml (on push to main only), so a push to main produces exactly one
# CI run and one deploy, while a pull request produces only this CI run.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

# Cancel superseded CI runs for the same branch/PR to avoid piling up builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Catalog regression tests
        run: npm run test:catalog

      # Two deployable artifacts exist, so CI builds both. Neither is allowed to
      # rot behind the other: the server build is what Vercel ships, the export
      # is what GitHub Pages ships, and a change that satisfies one can easily
      # break the other (route segment config, image optimisation, basePath).

      # 1. Server target — the Vercel artifact (SSR + ISR).
      - name: Build server target
        run: npm run build

      # 2. Static export — the Pages artifact. basePath is derived from the
      # repository name (matches next.config.ts and deploy-pages.yml).
      - name: Build static export
        run: npm run build:pages
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}

  backend:
    name: Backend (build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: medusa-prototype/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: medusa-prototype

      # `npm run build` -> `turbo build` -> `medusa build`. This compiles the
      # backend and admin bundle only; it does not start the server and needs
      # no Postgres/Redis connection.
      - name: Build backend
        run: npm run build
        working-directory: medusa-prototype

  backend-tests:
    name: Backend (unit + integration tests)
    runs-on: ubuntu-latest

    # @medusajs/test-utils spins up a real Postgres for each suite (it creates and
    # drops throwaway databases via pg-god), and the backend registers the Redis
    # event bus / workflow engine / cache / locking modules whenever REDIS_URL is
    # set — so the integration tests run against Postgres + Redis, matching production.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: medusa-prototype/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: medusa-prototype

      - name: Run unit tests
        run: npm run test:unit
        working-directory: medusa-prototype/apps/backend

      # Integration smoke tests: seed idempotency, catalog import idempotency
      # (ADR-001 upsert contract) and the Store API. @medusajs/test-utils reads the
      # DB_* variables to build its connection and to create/drop the per-suite test
      # databases on the Postgres service above.
      - name: Run integration tests
        run: npm run test:integration:http
        working-directory: medusa-prototype/apps/backend
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          DB_TEMP_NAME: medusa_integration_tests
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/medusa_integration_tests
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-jwt-secret
          COOKIE_SECRET: test-cookie-secret
          STORE_CORS: http://localhost:3000
          ADMIN_CORS: http://localhost:9000
          AUTH_CORS: http://localhost:3000,http://localhost:9000

      # Run the payment recovery lease and projection tests against PostgreSQL,
      # not as silently skipped unit suites without TBANK_INBOX_TEST_DATABASE_URL.
      - name: Run TBank payment recovery integration tests
        run: npm run test:integration:modules -- --runTestsByPath src/modules/tbank-notifications/__tests__/persistence.integration.spec.ts src/modules/tbank/__tests__/payment-reconciler.integration.spec.ts
        working-directory: medusa-prototype/apps/backend
        env:
          NODE_ENV: test
          TBANK_INBOX_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

  browser-checkout:
    name: Browser checkout (real Medusa + PostgreSQL, offline bank)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            medusa-prototype/package-lock.json
      - name: Install storefront dependencies
        run: npm ci --no-audit --no-fund
      - name: Install backend dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: medusa-prototype
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser checkout against PostgreSQL
        run: npm run test:integration:http -- --runTestsByPath integration-tests/http/checkout-browser.spec.ts
        working-directory: medusa-prototype/apps/backend
        env:
          NODE_ENV: test
          BROWSER_CHECKOUT_TEST: "true"
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          DB_TEMP_NAME: medusa_integration_tests
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/medusa_integration_tests
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-jwt-secret
          COOKIE_SECRET: test-cookie-secret
          STORE_CORS: http://127.0.0.1:4183
          ADMIN_CORS: http://localhost:9000
          AUTH_CORS: http://127.0.0.1:4183,http://localhost:9000
          TBANK_ENABLED: "true"
          TBANK_PAYMENT_PROVIDER_ID: pp_tbank_tbank
          TBANK_TERMINAL_KEY: TinkoffBankTest
          TBANK_PASSWORD: TinkoffBankTest
          TBANK_RECEIPT_SNAPSHOT_SECRET: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
          TBANK_API_BASE_URL: https://rest-api-test.tinkoff.ru/v2
          TBANK_SUCCESS_URL: https://mariomikke.shop/checkout/success
          TBANK_FAIL_URL: https://mariomikke.shop/checkout/fail
          TBANK_NOTIFICATION_URL: https://api.mariomikke.shop/hooks/payment/tbank
          CDEK_ENABLED: "false"
          YANDEX_DELIVERY_ENABLED: "false"
          POCHTA_ENABLED: "false"
          OWN_COURIER_ENABLED: "false"
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-medusa-offline-checkout
          path: test-results/real-medusa-*.png
          if-no-files-found: ignore
