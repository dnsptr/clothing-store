name: mario-mikke

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: medusa_backend
      POSTGRES_USER: medusa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medusa -d medusa_backend"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - backend

  medusa:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      network: host
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://medusa:${POSTGRES_PASSWORD}@127.0.0.1:5432/medusa_backend
      REDIS_URL: redis://:${REDIS_PASSWORD}@127.0.0.1:6379
      STORE_CORS: ${STORE_CORS}
      ADMIN_CORS: ${ADMIN_CORS}
      AUTH_CORS: ${AUTH_CORS}
      STOREFRONT_URL: ${STOREFRONT_URL:?STOREFRONT_URL is required}
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
      AUTH_MFA_ENCRYPTION_KEY: ${AUTH_MFA_ENCRYPTION_KEY}
      MEDUSA_ADMIN_ONBOARDING_TYPE: default
      MEDUSA_WORKER_MODE: shared
      MEDUSA_DISABLE_TELEMETRY: "true"
      DISABLE_MEDUSA_ADMIN: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    network_mode: host

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      BACKEND_HOST: ${BACKEND_HOST}
      ADMIN_BASIC_AUTH_HASH: ${ADMIN_BASIC_AUTH_HASH:?ADMIN_BASIC_AUTH_HASH is required}
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - medusa

  pg_backup:
    image: postgres:15-alpine
    restart: unless-stopped
    network_mode: host
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      # Прошлый вариант цикла делал ровно две вещи неправильно, и обе тихо.
      #
      # Первая: `pg_dump ... | gzip > файл`. Редирект создаёт файл ДО запуска
      # pg_dump, а код возврата конвейера здесь никто не проверял — упавший
      # дамп оставался на диске как валидный на вид архив.
      #
      # Вторая: `find -mtime +7 -delete` выполнялся следующей строкой
      # безусловно. Через неделю незамеченной поломки все рабочие копии
      # оказывались удалены, а на их месте лежал мусор.
      #
      # Теперь дамп пишется во временный файл, проверяется чтением оглавления
      # (`pg_restore --list` — настоящая проверка целостности custom-формата) и
      # только после этого публикуется. Ротация запускается лишь после
      # проверенного успеха: пока бэкап не получается, старые копии остаются.
      - sh
      - -c
      - |
        set -eu
        while true; do
          TS=$$(date +%Y%m%d_%H%M%S)
          TMP="/backups/.medusa_$$TS.dump.part"
          if pg_dump -h 127.0.0.1 -U medusa -Fc medusa_backend > "$$TMP" \
            && pg_restore --list "$$TMP" > /dev/null 2>&1; then
            gzip -c "$$TMP" > "/backups/medusa_$$TS.dump.gz"
            rm -f "$$TMP"
            find /backups -name '*.dump.gz' -mtime +7 -delete
            find /backups -name '*.dump.part' -mtime +1 -delete
            echo "[pg_backup] ok: medusa_$$TS.dump.gz"
          else
            rm -f "$$TMP"
            echo "[pg_backup] FAILED at $$TS — старые копии сохранены" >&2
          fi
          sleep 86400
        done

networks:
  backend:

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
